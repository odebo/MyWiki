[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wiki-mcp"
version = "0.1.0"
description = "MCP server exposing a Karpathy-style LLM Wiki (concepts/opinions/sources/topics) to LLM clients"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "zhuqichen" },
]
keywords = ["mcp", "wiki", "llm", "knowledge-base", "karpathy", "claude-code", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
]

[project.scripts]
wiki-mcp = "wiki_mcp.server:main"

[project.urls]
Homepage = "https://github.com/zhuqichen/wiki-mcp"
Repository = "https://github.com/zhuqichen/wiki-mcp"
Issues = "https://github.com/zhuqichen/wiki-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
